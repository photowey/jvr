[package]
name = "jvr"
version = "0.2.0"
edition = "2021"
resolver = "2"

authors = ["photowey <photowey@gmail.com>"]
license = "Apache-2.0"

documentation = "https://docs.rs/jvr"
repository = "https://github.com/photowey/jvr"
homepage = "https://github.com/photowey/jvr"

description = """
A simple and easy-to-use Java version manager (registry: jvr), similar to Node.js's nvm,
but it does not follow nvm's naming convention. Otherwise, it would be named 'jvm',
which could cause command conflicts or ambiguity.
"""

readme = "README.md"
keywords = ["cli", "command-line", "binary", "jdk"]
categories = ["command-line-utilities"]

[[bin]]
name = "jvr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
prettytable = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_System_Registry"] }
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]